<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Biruk Gizaw</title>
    <meta
      name="description"
      content="Simone Sniekers is a fashion editor, stylist and creative producer based in Amsterdam."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-top" id="site-top">
      <div class="site-top__menu" id="site-menu">
        <button
          type="button"
          class="site-top__menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-haspopup="true"
          aria-controls="menu-dropdown"
        >
          Menu
        </button>
        <nav class="site-menu__dropdown" id="menu-dropdown" aria-label="Site menu" hidden>
          <a class="site-menu__item" href="index.html" data-menu-action="fashion">Fashion design</a>
          <a class="site-menu__item" href="patches.html" data-menu-action="patches">Patches</a>
          <button type="button" class="site-menu__item" data-menu-action="info">Info</button>
        </nav>
      </div>
    </header>

    <aside class="info-panel" id="info-panel" aria-hidden="true">
      <div class="info-panel__image-wrap">
        <div class="image-wrap" id="info-image-wrap">
          <img id="info-image" alt="" />
          <span class="image-reveal"></span>
        </div>
      </div>

      <div class="info-panel__content">
        <div class="info-panel__bio info-slide info-slide--1" id="info-bio"></div>
        <div class="info-panel__meta">
          <div class="info-slide info-slide--2" id="info-contact"></div>
        </div>
      </div>
    </aside>

    <main id="root" aria-label="Portfolio"></main>

    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script src="app.js"></script>
  </body>
</html>
